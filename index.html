<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Spin Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11099294' data-sdk='show_11099294'></script>
    <style>
        body { background: #080b11; color: white; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .header { background: #1f2937; padding: 15px; border-radius: 15px; display: flex; justify-content: space-around; margin-bottom: 20px; border: 1px solid #374151; }
        .wheel-container { position: relative; width: 280px; height: 280px; margin: 20px auto; }
        #wheel-svg { width: 100%; height: 100%; transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99); }
        .pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ef4444; z-index: 10; }
        .btn { padding: 15px; width: 90%; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin: 8px; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div>Coins: <span id="coins">0</span></div>
        <div>Spins: <span id="spins">2</span></div>
        <button onclick="alert('Withdraw feature active!')">Withdraw</button>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <svg id="wheel-svg" viewBox="0 0 300 300">
            <circle cx="150" cy="150" r="145" fill="#1f2937" stroke="#38bdf8" stroke-width="5"/>
            <path d="M150,150 L150,5 A145,145 0 0,1 252.5,47.5 Z" fill="#ef4444"/>
            <path d="M150,150 L252.5,47.5 A145,145 0 0,1 295,150 Z" fill="#3b82f6"/>
            <path d="M150,150 L295,150 A145,145 0 0,1 252.5,252.5 Z" fill="#10b981"/>
            <path d="M150,150 L252.5,252.5 A145,145 0 0,1 150,295 Z" fill="#f59e0b"/>
            <circle cx="150" cy="150" r="30" fill="#080b11"/>
            <text x="150" y="158" text-anchor="middle" fill="white" font-weight="bold">SPIN</text>
        </svg>
    </div>

    <button class="btn" style="background:#10b981" onclick="doSpin()">SPIN NOW</button>
    <button class="btn" style="background:#3b82f6" onclick="watchAd()">WATCH AD (+1 SPIN)</button>

    <script>
        let coins = 0;
        let spins = 2;
        let rot = 0;

        function doSpin() {
            if (spins <= 0) return alert("No spins left!");
            spins--;
            let win = [50, 100, 200, 500][Math.floor(Math.random() * 4)];
            coins += win;
            rot += 1800 + (Math.floor(Math.random() * 4) * 90);
            
            document.getElementById('wheel-svg').style.transform = `rotate(${rot}deg)`;
            document.getElementById('coins').innerText = coins;
            document.getElementById('spins').innerText = spins;
        }

        async function watchAd() {
            if(window.show_11099294) {
                await window.show_11099294();
                spins++;
                document.getElementById('spins').innerText = spins;
            }
        }
    </script>
</body>
</html>
