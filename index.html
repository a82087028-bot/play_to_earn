<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn & Withdraw App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input { padding: 10px; width: 80%; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; cursor: pointer; background: #0088cc; color: white; border: none; border-radius: 5px; margin: 5px; }
        ul { list-style: none; padding: 0; text-align: left; font-size: 14px; }
        li { background: #eee; margin: 5px 0; padding: 5px; border-radius: 3px; }
    </style>
</head>
<body>

    <h3>User: <span id="username">Guest</span> (ID: <span id="userid">0</span>)</h3>

    <div class="card">
        <h3>Balance: <span id="balance">0</span> Coins</h3>
        <input type="text" id="walletAddress" placeholder="Enter Crypto Wallet Address (TRX/USDT)">
        <button onclick="withdraw()">Withdraw (Min 20k)</button>
    </div>

    <div class="card">
        <h3>Earn Coins</h3>
        <button onclick="spin()">Spin Wheel</button>
        <button onclick="watchAd()">Watch Ad (+100)</button>
    </div>

    <div class="card">
        <h3>History</h3>
        <ul id="history-list"></ul>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        const user = tg.initDataUnsafe.user;
        
        let balance = parseInt(localStorage.getItem('balance')) || 0;
        let history = JSON.parse(localStorage.getItem('history')) || [];

        document.getElementById('username').innerText = user?.username || "Guest";
        document.getElementById('userid').innerText = user?.id || "N/A";
        document.getElementById('balance').innerText = balance;
        renderHistory();

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance;
            localStorage.setItem('balance', balance);
        }

        function watchAd() {
            updateBalance(100);
            alert("Earned 100 coins!");
        }

        function spin() {
            let win = Math.floor(Math.random() * 500) + 10;
            updateBalance(win);
            alert("You won " + win + " coins!");
        }

        function withdraw() {
            let address = document.getElementById('walletAddress').value;
            if (balance < 20000) {
                alert("Minimum 20,000 coins required!");
            } else if (!address) {
                alert("Please enter your wallet address.");
            } else {
                let record = `${new Date().toLocaleDateString()}: Withdrew ${balance} coins to ${address.substring(0,6)}...`;
                history.unshift(record);
                localStorage.setItem('history', JSON.stringify(history));
                updateBalance(-balance);
                renderHistory();
                alert("Withdrawal Successful!");
            }
        }

        function renderHistory() {
            document.getElementById('history-list').innerHTML = history.map(item => `<li>${item}</li>`).join('');
        }
    </script>
</body>
</html>
