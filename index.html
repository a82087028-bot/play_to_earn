<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Spin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src='//libtl.com/sdk.js' data-zone='11099294' data-sdk='show_11099294'></script>
    <script>
        const BACKEND_URL = window.location.origin;
        let userId = "test_user_123";

        window.onload = () => {
            let tg = window.Telegram.WebApp;
            tg.ready();
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userId = String(tg.initDataUnsafe.user.id);
            }
            fetchUserData();
        };

        async function fetchUserData() {
            try {
                let res = await fetch(`${BACKEND_URL}/api/user-data?userId=${userId}`);
                let data = await res.json();
                document.getElementById('coin-count').innerText = data.coins || 0;
                document.getElementById('spin-count').innerText = data.spins || 0;
            } catch (e) { console.error(e); }
        }

        async function handleSpin() {
            let res = await fetch(`${BACKEND_URL}/api/spin-wheel`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId})
            });
            let data = await res.json();
            if(data.error) alert(data.error);
            else fetchUserData();
        }

        async function watchAd() {
            if(typeof show_11099294 === 'function') {
                show_11099294().then(async () => {
                    await fetch(`${BACKEND_URL}/api/reward-ad`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({userId})
                    });
                    fetchUserData();
                });
            }
        }
    </script>
    <style>
        body { background: #080b11; color: white; text-align: center; font-family: sans-serif; }
        .stats { background: #1f2937; padding: 20px; border-radius: 15px; margin: 20px; }
        button { padding: 15px 30px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; margin: 5px; }
        .spin-btn { background: #10b981; color: white; }
        .ad-btn { background: #3b82f6; color: white; }
    </style>
</head>
<body>
    <h1>CRYPTO SPIN</h1>
    <div class="stats">
        <p>Coins: <span id="coin-count">0</span> C</p>
        <p>Spins: <span id="spin-count">0</span></p>
    </div>
    
    <div style="width: 200px; height: 200px; border: 5px solid white; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center;">
        WHEEL HERE
    </div>

    <button class="spin-btn" onclick="handleSpin()">SPIN NOW</button>
    <button class="ad-btn" onclick="watchAd()">WATCH AD</button>
</body>
</html>
